name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/mahjong-game-implementation-x41koo
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 事前に一度だけ、リポジトリの Settings > Pages で
      # Source を "GitHub Actions" にしておく必要があります。
      # (Pages サイトの作成には管理者権限が必要で、GITHUB_TOKEN では作成できません)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
